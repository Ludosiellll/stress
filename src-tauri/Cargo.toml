[workspace]
members = [".", "backup"]
resolver = "2"

[package]
name = "stress-trainer"
version = "0.1.0"
description = "Тренажёр отбора"
edition = "2021"
publish = false

[lib]
name = "stress_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
